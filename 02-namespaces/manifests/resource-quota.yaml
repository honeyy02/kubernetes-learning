apiVersion: v1
kind: ResourceQuota
metadata:
  name: dev-quota
  namespace: dev
spec:
  hard:
    pods: "10"                    # max 10 pods in dev namespace
    requests.cpu: "2"             # total CPU requests across all pods
    requests.memory: "4Gi"        # total memory requests
    limits.cpu: "4"               # total CPU limits
    limits.memory: "8Gi"          # total memory limits
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: qa-quota
  namespace: qa
spec:
  hard:
    pods: "5"
    requests.cpu: "1"
    requests.memory: "2Gi"
    limits.cpu: "2"
    limits.memory: "4Gi"

# ── How to apply ──────────────────────────────────────────
# kubectl apply -f resource-quota.yaml
#
# ── View quota usage ──────────────────────────────────────
# kubectl get resourcequota -n dev
# kubectl describe resourcequota dev-quota -n dev
#
# ── What happens when quota is exceeded? ──────────────────
# Pod creation is REJECTED with:
# "exceeded quota: dev-quota, requested: pods=1, used: pods=10, limited: pods=10"