apiVersion: v1
kind: Pod
metadata:
  name: dev-pod
  namespace: dev                  # explicitly placed in dev namespace
  labels:
    app: nginx
    env: development
spec:
  containers:
    - name: nginx
      image: nginx:alpine
      ports:
        - containerPort: 80
---
apiVersion: v1
kind: Pod
metadata:
  name: qa-pod
  namespace: qa                   # same app name, different namespace — no collision
  labels:
    app: nginx
    env: qa
spec:
  containers:
    - name: nginx
      image: nginx:alpine
      ports:
        - containerPort: 80

# ── How to apply ──────────────────────────────────────────
# Step 1: Create namespaces first
#   kubectl apply -f namespace.yaml
#
# Step 2: Deploy pods
#   kubectl apply -f pod-in-namespace.yaml
#
# ── Verify ────────────────────────────────────────────────
# kubectl get pods -n dev
# kubectl get pods -n qa
# kubectl get pods -A              # see all pods across all namespaces
#
# ── Cleanup ───────────────────────────────────────────────
# kubectl delete -f pod-in-namespace.yaml